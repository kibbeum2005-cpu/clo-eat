name: DB 반영 (Supabase)

# main 에 푸시할 때 supabase/schema.sql 이 바뀌었으면 Supabase DB 에 자동으로 실행한다.
# schema.sql 은 여러 번 실행해도 안전하도록 작성돼 있고, 한 번에 실행되므로 중간에 실패하면 전부 취소된다.
#
# 준비물: GitHub 저장소 Settings → Secrets and variables → Actions 에
#         SUPABASE_ACCESS_TOKEN (Supabase 개인 액세스 토큰) 시크릿을 추가한다.
#         시크릿이 없으면 아무것도 하지 않고 경고만 남긴다.
on:
  push:
    branches: [main]
    paths:
      - supabase/schema.sql
      - .github/workflows/db-migrate.yml
  workflow_dispatch: # Actions 탭에서 수동 실행 (위험 SQL 점검을 건너뛴다)

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: vemefzgvkuzrhanylmmt

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 시크릿 확인
        id: secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 시크릿이 없어 DB 반영을 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에서 추가해 주세요."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # 되돌릴 수 없는 SQL(테이블/컬럼/스키마 삭제, truncate, delete from)이 새로 추가됐으면 자동 실행하지 않는다.
      # 확인 후 정말 필요하면 Actions 탭에서 "Run workflow" 로 직접 실행한다.
      - name: 위험한 SQL 점검
        if: steps.secret.outputs.run == 'true' && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          risky=$(git diff --unified=0 "$base" HEAD -- supabase/schema.sql | grep -E '^\+' | grep -vE '^\+\+\+' | grep -iE 'drop[[:space:]]+(table|column|schema)|truncate|delete[[:space:]]+from' || true)
          if [ -n "$risky" ]; then
            echo "::error::되돌릴 수 없는 SQL 이 새로 추가되어 자동 실행을 멈췄습니다. 내용을 확인한 뒤 필요하면 Actions 탭에서 Run workflow 로 직접 실행해 주세요."
            echo "$risky"
            exit 1
          fi
          echo "위험한 SQL 없음"

      - name: schema.sql 실행
        if: steps.secret.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > payload.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "HTTP ${status}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::DB 반영에 실패했습니다. 아래 응답을 확인해 주세요."
            cat response.json
            exit 1
          fi
          echo "DB 반영 완료"
